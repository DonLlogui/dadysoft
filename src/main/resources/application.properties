spring.application.name=dadysoft
# Configuración de la base de datos MySQL (para XAMPP)

# URL de conexión a la base de datos MySQL
# localhost:3306 es la dirección por defecto de MySQL en XAMPP
# orderservice_db es el nombre de tu base de datos
# useSSL=false es importante para evitar errores relacionados con SSL que no necesitas localmente
# serverTimezone=UTC es crucial para evitar problemas de zona horaria con fechas
spring.datasource.url=jdbc:mysql://localhost:3306/orderservice_db?useSSL=false&serverTimezone=UTC

# Nombre de usuario de la base de datos (por defecto en XAMPP sin modificar)
spring.datasource.username=root

# Contraseña de la base de datos (por defecto en XAMPP sin modificar, suele estar vacía)
spring.datasource.password=

# Driver de la base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
# 'update' intentará actualizar el esquema de la base de datos para que coincida con tus entidades JPA
# CUIDADO: En producción, 'update' puede ser arriesgado. Para desarrollo, es práctico.
# 'create-drop' recreará la base de datos y todas las tablas cada vez que inicies la aplicación (útil para pruebas)
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL que Hibernate genera en la consola (útil para depuración)
spring.jpa.show-sql=true

# Dialecto de Hibernate para MySQL 8 (asegúrate de que sea el correcto para tu versión de MySQL en XAMPP)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Si tu XAMPP MySQL es una versión anterior a 8 (ej. MySQL 5.7), usa este dialecto:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect